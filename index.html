<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <title>Vite + TS</title>
  </head>
  <body>
    <header class="main-header">
      <fieldset class="tile-type-selector">
        <label>
          <input type="radio" name="tileType" value="TRIANGLE" checked />
          Triangle
        </label>
        <label>
          <input type="radio" name="tileType" value="QUARTER_CIRCLE" />
          Quadratic Circles
        </label>
        <label>
          <input type="radio" name="tileType" value="S_CURVE" />
          S-Curve
        </label>
        <label>
          <input type="radio" name="tileType" value="DIAGONAL" />
          Diagonal
        </label>
      </fieldset>
    </header>

    <section class="chart-container"></section>
    <script type="module" src="src/ts/main.ts"></script>
  </body>
</html>
